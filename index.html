<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyGate 控制台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">TG</span>
    <div class="brand-text">
      <h1>TinyGate 控制台</h1>
      <p>物联网边缘网关</p>
    </div>
  </div>

  <div class="pills">
    <span class="pill" id="apiPill"><i class="dot"></i><span id="apiPillText">连接中</span></span>
    <span class="pill" id="wsPill"><i class="dot"></i><span id="wsPillText">实时通道</span></span>
  </div>

  <div class="actions">
    <select id="sourceSelect" title="数据源">
      <option value="mock">模拟数据</option>
      <option value="real">真实后端</option>
    </select>
    <button class="btn ghost" id="btnRefresh">刷新</button>
    <button class="btn ghost" id="btnSettings">设置</button>
  </div>
</header>

<section class="stats">
  <div class="stat">
    <span class="stat-label">在线网关</span>
    <strong id="statGw">—</strong>
  </div>
  <div class="stat">
    <span class="stat-label">在线设备</span>
    <strong id="statDev">—</strong>
  </div>
  <div class="stat">
    <span class="stat-label">执行中命令</span>
    <strong id="statCmd">0</strong>
  </div>
  <div class="stat">
    <span class="stat-label">本设备事件</span>
    <strong id="statEvt">0</strong>
  </div>
</section>

<main class="layout">
  <aside class="sidebar">
    <section class="block">
      <h2>网关 <span class="count" id="gatewayCount">0</span></h2>
      <div id="gatewayList" class="list"></div>
    </section>
    <section class="block">
      <h2>设备 <span class="count" id="deviceCount">0</span></h2>
      <div id="deviceList" class="list"></div>
    </section>
  </aside>

  <section class="content">
    <div id="emptyState" class="empty">
      <p>选择左侧设备查看详情</p>
      <p class="sub">当前为模拟数据，可直接演示命令流转与实时通知</p>
    </div>

    <div id="devicePanel" class="hidden">
      <section class="card hero">
        <div class="hero-info">
          <div class="hero-title">
            <h2 id="devName">—</h2>
            <span class="badge" id="devOnline">—</span>
          </div>
          <p class="meta" id="devMeta">—</p>
        </div>
        <div class="hero-control" id="heroControl"></div>
      </section>

      <section class="card">
        <h3>实际状态 <span class="hint">设备反馈值</span></h3>
        <table class="table">
          <thead><tr><th>端点</th><th>属性</th><th>当前值</th><th>类型</th></tr></thead>
          <tbody id="stateBody"></tbody>
        </table>
      </section>

      <section class="card">
        <h3>命令记录 <span class="hint">受理 → 下发 → 接收 → 完成</span></h3>
        <div id="commandList" class="cmd-list"></div>
      </section>

      <section class="card">
        <h3>事件历史 <span class="hint">按接收时间倒序</span></h3>
        <table class="table">
          <thead><tr><th>接收时间</th><th>类型</th><th>内容</th><th>补传</th></tr></thead>
          <tbody id="eventBody"></tbody>
        </table>
      </section>
    </div>
  </section>
</main>

<footer class="logbar">
  <div class="log-head">
    <span>运行日志</span>
    <button class="btn tiny ghost" id="btnClearLog">清空</button>
  </div>
  <div id="logList" class="log-list"></div>
</footer>

<div class="overlay hidden" id="settingsModal">
  <div class="modal">
    <h3>连接设置</h3>
    <label>API 基址
      <input id="inputApiBase" type="text" placeholder="http://39.107.159.76:8000/api/v1">
    </label>
    <label>访问令牌
      <input id="inputToken" type="text" placeholder="粘贴 access_token">
    </label>
    <p class="note">令牌保存在浏览器本地，仅用于调试。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="btnCloseSettings">取消</button>
      <button class="btn" id="btnSaveSettings">保存并重载</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/ws.js"></script>
<script src="js/app.js"></script>
</body>
</html>
